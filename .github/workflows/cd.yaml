name: Publish to npm

on:
  push:
    branches: [master]
    paths:
      - "src/**"
  workflow_dispatch:
    inputs:
      version:
        description: Version bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

# The release commit itself only touches package.json/package-lock.json/
# dist, never src, so it can't re-trigger this via the push path. Serialize
# runs so two src-touching merges landing close together don't race the
# same release process.
concurrency:
  group: cd-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm >= 11.5.1; the version bundled
      # with setup-node's Node 22 build can lag behind that.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Lint & format check
        run: |
          npm run lint
          npm run format:check

      - name: Test
        run: npm test

      - name: Bump version
        id: bump
        run: |
          npm version "${{ inputs.version || 'patch' }}" --no-git-tag-version
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Rebuild dist for the new version
        run: npm run build

      - name: Commit and tag the release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json dist
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          # master may have moved since checkout (e.g. another merge landed
          # while lint/build/test were running); rebase our single release
          # commit onto the latest tip instead of racing it with a bare push.
          git fetch origin master
          git rebase origin/master
          # Tag after rebasing, so it points at the commit that actually
          # gets pushed rather than a pre-rebase SHA. Push it by name
          # explicitly: it's a lightweight tag, and `--follow-tags` only
          # pushes annotated tags.
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin master "v${{ steps.bump.outputs.version }}"

      - name: Publish to npm
        run: npm publish --access public

      - name: Create GitHub release
        run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
